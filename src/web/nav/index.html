<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1720">
  <title>IDR Navigator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f1720; --panel: rgba(17, 25, 34, 0.92); --line: #243140; --text: #e6edf3; --muted: #8a9aab;
      --aided: #2fb67c; --dr: #f0a020; --reacq: #3b8bff; --degraded: #e5602e; --accent: #3b8bff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
    .panel { position: fixed; left: 12px; right: 12px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; backdrop-filter: blur(6px); }
    #hud { top: max(12px, env(safe-area-inset-top)); padding: 10px 14px; display: grid;
      grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center; }
    #mode { font-weight: 700; letter-spacing: .04em; font-size: 12px; padding: 6px 10px; border-radius: 999px;
      color: #08110c; background: var(--aided); white-space: nowrap; transition: background .2s; }
    #speed { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
    #speed small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }
    .meters { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .meter { font-size: 11px; color: var(--muted); }
    .meter b { display: block; color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; }
    .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
    #headingBox { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    #controls { bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px; display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; }
    button, select { font: inherit; color: var(--text); background: #1b2733; border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
    button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    button#tunnel { font-weight: 700; }
    button#tunnel.on { background: var(--dr); border-color: var(--dr); color: #1b1200; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; }
    .grow { flex: 1; }
    #progress { width: 100%; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
    #progress i { display: block; height: 100%; width: 0; background: var(--muted); }
    #log { position: fixed; right: 12px; top: 150px; width: min(320px, calc(100vw - 24px)); max-height: 40vh;
      overflow: auto; padding: 10px 12px; font-size: 12px; display: none; }
    #log.show { display: block; }
    #log h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
    #log table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #log td, #log th { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--line); }
    #log th { color: var(--muted); font-weight: 500; }
    .pass { color: var(--aided); } .fail { color: var(--degraded); }
    #toast { position: fixed; left: 50%; top: 45%; transform: translateX(-50%); padding: 12px 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: none; max-width: 90vw; text-align: center; }
    .legend { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; margin-right: 4px; vertical-align: middle;
      background: var(--c); }
  </style>
</head>
<body>
  <canvas id="map"></canvas>

  <section id="hud" class="panel" aria-live="polite">
    <span id="mode">STARTING</span>
    <span id="headingBox">— · —</span>
    <span id="speed">0<small>km/h</small></span>
    <div class="meters">
      <div class="meter">GNSS<b id="gnssQ">—</b><div class="bar"><i id="gnssBar"></i></div></div>
      <div class="meter">AI speed<b id="aiSpeed">—</b><div class="bar"><i id="aiBar"></i></div></div>
      <div class="meter">Map match<b id="mapQ">—</b><div class="bar"><i id="mapBar"></i></div></div>
      <div class="meter" id="errBox">Pos. σ<b id="posStd">—</b><div class="bar"><i id="errBar"></i></div></div>
    </div>
  </section>

  <section id="log" class="panel">
    <h3>GNSS OUTAGES (replay vs ground truth)</h3>
    <table><thead><tr><th>#</th><th>time</th><th>dist</th><th>error</th><th>drift</th></tr></thead><tbody id="logBody"></tbody></table>
  </section>

  <section id="controls" class="panel">
    <div class="seg" role="tablist">
      <button id="srcReplay" class="on">Replay</button><button id="srcLive">Live</button>
    </div>
    <select id="tripSel" aria-label="Replay trip"></select>
    <button id="play">▶ Play</button>
    <div class="seg" id="rateSeg"><button data-r="1">1×</button><button data-r="4" class="on">4×</button><button data-r="16">16×</button><button data-r="64">64×</button></div>
    <button id="tunnel" title="Drop GNSS to simulate a tunnel / underpass">🚇 Simulate tunnel</button>
    <button id="follow" class="on">Follow</button>
    <button id="logBtn">Outages</button>
    <div class="legend grow">
      <span style="--c:#3b8bff">IDR estimate</span><span style="--c:#8a9aab">ground truth</span><span style="--c:#2fb67c">GNSS fixes</span>
    </div>
    <div id="progress"><i></i></div>
  </section>

  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
